# Dedicated natter-grafana: its own Loki datasource (uid Loki so the dashboard's
# datasource reference resolves). Reaches Loki over the shared `web` network.
# Read-only viewer instance — points at the same Loki as your main stack.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: Loki
    url: http://loki:3100
    isDefault: true
    editable: false
