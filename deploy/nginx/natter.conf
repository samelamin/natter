# natter.cc — reverse proxy to the Natter container.
#
# The `website` nginx container mounts a single file at
# /etc/nginx/conf.d/default.conf (from infra/nginx/nginx.conf). Append this
# server block to that file (see deploy/README.md), then `nginx -t` + reload.
#
# HTTP→HTTPS is already handled by the existing `server { listen 80;
# server_name _; return 301 https://$host$request_uri; }` catch-all, so only
# the TLS server is needed here.
#
# Requires a Cloudflare origin cert for natter.cc at:
#   /etc/nginx/certs/natter.crt  +  /etc/nginx/certs/natter.key

server {
    listen 443 ssl;
    server_name natter.cc www.natter.cc;

    ssl_certificate     /etc/nginx/certs/natter.crt;
    ssl_certificate_key /etc/nginx/certs/natter.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Resolve the upstream container via Docker's embedded DNS at request time.
    resolver 127.0.0.11 valid=30s;
    set $natter_upstream http://natter:3000;

    location / {
        proxy_pass $natter_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # /api/recommend streams NDJSON — disable buffering so chunks flush
        # to the client as they are produced (Next.js self-hosting guidance).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# grafana.natter.cc — public, read-only usage dashboard (dedicated natter-grafana
# container; anonymous viewing, only the Natter dashboard). Cert covers *.natter.cc.
server {
    listen 443 ssl;
    server_name grafana.natter.cc;

    ssl_certificate     /etc/nginx/certs/natter.crt;
    ssl_certificate_key /etc/nginx/certs/natter.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s;
    set $natter_grafana http://natter-grafana:3000;

    location / {
        proxy_pass $natter_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
